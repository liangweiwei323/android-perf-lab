<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <title>Android Perf Lab</title>
  <style>
    :root{--bg:#07111d;--panel:#0d1b2c;--panel2:#12263c;--line:#213b55;--text:#edf7ff;--muted:#88a1ba;--cyan:#42d8cf;--blue:#5a8cff;--orange:#ffb45f;--red:#ff6572;--green:#54d69a}
    *{box-sizing:border-box} body{margin:0;color:var(--text);background:radial-gradient(circle at 8% 0,#102b42 0,transparent 32%),linear-gradient(150deg,#06101b,#091728 60%,#07111d);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}
    .shell{max-width:1260px;margin:auto;padding:30px 24px 70px}.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.top h1{margin:0;font-size:30px;letter-spacing:-.5px}.top p{margin:6px 0 0;color:var(--muted)}.top-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}.client-actions{display:none;gap:7px}.client-actions button{padding:7px 10px;font-size:12px}
    .pill{border:1px solid #2b5e76;color:var(--cyan);padding:6px 11px;border-radius:99px;background:#0a2130}.layout{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:rgba(13,27,44,.94);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 50px rgba(0,0,0,.18)}.pad{padding:18px}.card h2{font-size:16px;margin:0 0 15px}.field{margin:13px 0}.field label{display:block;color:var(--muted);margin-bottom:6px}.row{display:flex;gap:8px}select,input,button{font:inherit}select,input{width:100%;border:1px solid #2a4863;border-radius:10px;background:#081725;color:var(--text);padding:10px 11px;outline:none}select:focus,input:focus{border-color:var(--cyan)}button{border:0;border-radius:10px;padding:10px 14px;color:#041218;background:var(--cyan);font-weight:700;cursor:pointer}button.secondary{background:#19334a;color:var(--text);border:1px solid #31516d}button.danger{background:#3b1d2a;color:#ffc8ce;border:1px solid #743446}button:disabled{opacity:.45;cursor:not-allowed}.hint{color:var(--muted);font-size:12px;margin-top:8px}
    .workspace{min-width:0}.status-head{display:flex;justify-content:space-between;align-items:center}.status{font-weight:700}.status.running{color:var(--cyan)}.status.failed{color:var(--red)}.status.completed{color:var(--green)}.progress{height:9px;background:#07111d;border-radius:99px;overflow:hidden;margin:13px 0}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width .5s}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.metric{padding:14px;border-radius:13px;background:linear-gradient(160deg,var(--panel2),#0a1929);border:1px solid var(--line)}.metric.live{border-color:#267e82;background:linear-gradient(160deg,#123c49,#0a1d2b)}.metric-label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.metric b{display:block;font-size:22px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric-help{position:relative;display:inline-grid;place-items:center;width:16px;height:16px;padding:0;border:1px solid #476988;border-radius:50%;background:#142b43;color:#a9c9e8;font:700 10px/1 "Segoe UI",sans-serif;cursor:help}.metric-help:hover,.metric-help:focus-visible{outline:none;border-color:var(--cyan);background:var(--cyan);color:#061827}.metric-help::after{content:attr(data-tip);position:absolute;z-index:10;left:50%;top:24px;width:min(310px,calc(100vw - 48px));padding:11px 12px;border:1px solid #3a6686;border-radius:9px;background:#071522;color:#c8d9e8;font:13px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;text-align:left;box-shadow:0 14px 30px rgba(0,0,0,.45);opacity:0;visibility:hidden;pointer-events:none;transform:translateX(-50%)}.metric-help:hover::after,.metric-help:focus::after{opacity:1;visibility:visible}.chart-wrap{position:relative;margin-top:13px}.chart{display:block;height:270px;width:100%;background:#091725;border:1px solid var(--line);border-radius:13px;cursor:crosshair}.chart-tooltip{position:absolute;z-index:8;min-width:155px;padding:9px 11px;border:1px solid #3a6686;border-radius:9px;background:rgba(5,18,31,.96);color:#d9e9f6;font-size:12px;line-height:1.55;box-shadow:0 10px 28px rgba(0,0,0,.42);pointer-events:none;opacity:0;visibility:hidden;transform:translate(10px,-50%)}.chart-tooltip.visible{opacity:1;visibility:visible}.chart-tooltip strong{display:block;color:#fff;font-size:13px}.legend{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:9px}.legend span[data-key]{padding:4px 8px;border:1px solid transparent;border-radius:99px;cursor:pointer;user-select:none}.legend span[data-key]:hover{color:var(--text)}.legend span.active{color:var(--text);border-color:#365b78;background:#10283c}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
    .history{margin-top:18px;overflow:hidden}.history-head{display:flex;justify-content:space-between;align-items:center;padding:17px 18px;border-bottom:1px solid var(--line)}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}tbody tr{cursor:pointer}tbody tr:hover{background:#10243a}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#19334a;color:#b9cfe2;font-size:12px}.error{margin-top:12px;padding:10px;border-radius:10px;background:#351b25;color:#ffc3cb;display:none}.empty{padding:32px;text-align:center;color:var(--muted)}a{color:var(--cyan)}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><main class="shell">
  <header class="top"><div><h1>Android Perf Lab</h1><p>本地采集 · FrameTimeline确定性分析 · 中文HTML报告</p></div><div class="top-actions"><div class="client-actions" id="clientActions"><button class="secondary" id="installOverlay">安装悬浮窗</button><button class="secondary" id="openReports">报告目录</button><button class="secondary" id="openData">数据目录</button></div><span class="pill" id="health">正在连接服务…</span></div></header>
  <section class="layout">
    <aside class="card pad">
      <h2>新建测试任务</h2>
      <div class="field"><label>ADB设备</label><div class="row"><select id="device"></select><button class="secondary" id="refreshDevice">刷新</button></div><div class="hint" id="deviceInfo"></div></div>
      <div class="field"><label>测试应用</label><select id="package"></select></div>
      <div class="field"><label>或直接输入包名</label><input id="packageManual" value="com.xiaoji.egggame" placeholder="com.example.app"></div>
      <div class="field"><label>采集时长（秒）</label><input id="duration" type="number" min="5" max="3600" value="60"></div>
      <div class="row"><button id="start" style="flex:1">开始采集</button><button id="stop" class="danger" disabled>停止</button></div>
      <div class="hint">FPS在任务结束后由Trace计算；采集中实时记录CPU、内存和温度。</div>
      <div class="error" id="error"></div>
    </aside>
    <section class="workspace">
      <div class="card pad">
        <div class="status-head"><div><h2 style="margin-bottom:4px">当前任务</h2><div class="hint" id="sessionMeta">尚未开始</div></div><div class="status" id="sessionStatus">空闲</div></div>
        <div class="progress"><i id="progressBar"></i></div>
        <div class="metrics">
          <div class="metric live"><div class="metric-label"><span>实时FPS</span><button class="metric-help" type="button" data-tip="最近一个刷新窗口内测得的实时FPS，用于观察当前画面变化；数值会每0.5秒更新，不代表整个测试的平均值。" aria-label="实时FPS说明">?</button></div><b id="realtimeFps">--</b></div>
          <div class="metric"><div class="metric-label"><span>平均FPS</span><button class="metric-help" type="button" data-tip="采集时间段内每个1秒FPS点的算术平均值。越高且越接近目标刷新率通常越流畅，加载和静止画面也会计入。" aria-label="平均FPS说明">?</button></div><b id="fps">--</b></div>
          <div class="metric"><div class="metric-label"><span>App CPU</span><button class="metric-help" type="button" data-tip="SoloX同口径：目标应用CPU时间占整机全部逻辑核心总时间的比例，范围0–100%。" aria-label="App CPU说明">?</button></div><b id="appCpu">--</b></div>
          <div class="metric"><div class="metric-label"><span>Total CPU</span><button class="metric-help" type="button" data-tip="整机非空闲CPU时间占全部逻辑核心总时间的比例，范围0–100%，包含目标应用和系统负载。" aria-label="Total CPU说明">?</button></div><b id="totalCpu">--</b></div>
          <div class="metric"><div class="metric-label"><span>GPU占用</span><button class="metric-help" type="button" data-tip="GPU忙碌时间占驱动统计窗口的比例。当前仅支持已验证的Qualcomm KGSL节点；不支持时显示N/A，不用频率或温度估算。" aria-label="GPU占用说明">?</button></div><b id="gpuUsage">--</b></div>
          <div class="metric"><div class="metric-label"><span>内存</span><button class="metric-help" type="button" data-tip="目标应用UID下全部进程的Total PSS及其占设备物理内存的比例；包含模拟器核心、Wine和PC游戏原生进程。" aria-label="内存说明">?</button></div><b id="memory">--</b></div>
          <div class="metric"><div class="metric-label"><span>CPU温度</span><button class="metric-help" type="button" data-tip="设备可读取CPU温度传感器中的当前最高值。持续高温可能导致降频；不同厂商传感器口径可能不同。" aria-label="CPU温度说明">?</button></div><b id="temperature">--</b></div>
        </div>
        <div class="chart-wrap"><canvas class="chart" id="chart" width="900" height="270"></canvas><div class="chart-tooltip" id="chartTooltip"></div></div>
        <div class="legend"><span class="active" data-key="realtime_fps"><i class="dot" style="background:var(--cyan)"></i>实时FPS</span><span data-key="app_cpu_normalized_percent"><i class="dot" style="background:var(--blue)"></i>App CPU %</span><span data-key="system_cpu_percent"><i class="dot" style="background:#a979ff"></i>Total CPU %</span><span data-key="gpu_usage_percent"><i class="dot" style="background:#42d891"></i>GPU占用 %</span><span data-key="memory_mb"><i class="dot" style="background:var(--orange)"></i>内存 MB</span><span data-key="cpu_temperature_c"><i class="dot" style="background:var(--red)"></i>CPU温度 °C</span><span class="hint" style="padding:4px 0">点击切换指标</span></div>
        <div id="reportAction" style="margin-top:13px"></div>
        <div id="evaluationSummary" style="margin-top:9px;color:var(--cyan);font-weight:600"></div>
        <div id="perfdogMetrics" class="hint" style="margin-top:9px"></div>
      </div>
    </section>
  </section>
  <section class="card history">
    <div class="history-head"><div><strong>历史任务</strong><div class="hint">点击任务查看详情与报告</div></div><button class="secondary" id="refreshHistory">刷新</button></div>
    <div style="overflow:auto"><table><thead><tr><th>开始时间</th><th>应用</th><th>时长</th><th>平均FPS</th><th>App CPU</th><th>内存峰值</th><th>状态</th></tr></thead><tbody id="historyBody"></tbody></table></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);let currentId=null,currentSession=null,pollTimer=null,activeChartMetric='realtime_fps',chartGeometry=null,chartHoverPoint=null;
const statusNames={starting:'准备中',capturing:'采集中',stopping:'停止中',analyzing:'分析中',completed:'已完成',failed:'失败'};
function showError(message){const el=$('error');el.textContent=message||'';el.style.display=message?'block':'none'}
async function api(url,options={}){const response=await fetch(url,{headers:{'Content-Type':'application/json'},...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||`请求失败 ${response.status}`);return data}
async function loadDevices(){showError('');const data=await api('/api/devices');const ready=data.devices.filter(d=>d.state==='device');$('device').innerHTML=ready.map(d=>`<option value="${d.serial}">${d.manufacturer||''} ${d.model||d.serial} · Android ${d.android_version||''}</option>`).join('');if(!ready.length){$('device').innerHTML='<option>没有已授权设备</option>';return}$('deviceInfo').textContent=`序列号 ${ready[0].serial} · API ${ready[0].api_level} · ${ready[0].soc||ready[0].abi}`;await loadPackages()}
async function loadPackages(){const serial=$('device').value;if(!serial)return;const data=await api(`/api/packages?serial=${encodeURIComponent(serial)}`);$('package').innerHTML=data.packages.map(p=>`<option value="${p.package_name}" ${p.package_name==='com.xiaoji.egggame'?'selected':''}>${p.package_name}</option>`).join('')}
async function startSession(){showError('');const packageName=$('packageManual').value.trim()||$('package').value;const payload={serial:$('device').value,package_name:packageName,duration:Number($('duration').value)};const session=await api('/api/sessions',{method:'POST',body:JSON.stringify(payload)});currentId=session.id;$('start').disabled=true;$('stop').disabled=false;await refreshCurrent();startPolling()}
async function stopSession(){if(!currentId)return;await api(`/api/sessions/${currentId}/stop`,{method:'POST'});$('stop').disabled=true;await refreshCurrent()}
function number(value,digits=1){return value==null?'--':Number(value).toFixed(digits)}
function renderEvaluationSummary(session){const evaluation=session?.result?.evaluation;const el=$('evaluationSummary');el.textContent=evaluation?.available?`帧率综合评价 ${evaluation.grade}（${number(evaluation.overall_score)}分 · ${evaluation.label}） · 绝对体验：${evaluation.absolute_experience} · 目标 ${number(evaluation.target_fps,0)} FPS`:''}
const chartSeries={realtime_fps:{label:'实时FPS',unit:'FPS',color:'#42d8cf'},app_cpu_normalized_percent:{label:'App CPU',unit:'%',color:'#5a8cff'},system_cpu_percent:{label:'Total CPU',unit:'%',color:'#a979ff'},gpu_usage_percent:{label:'GPU占用',unit:'%',color:'#42d891'},memory_mb:{label:'内存',unit:'MB',color:'#ffb45f'},cpu_temperature_c:{label:'CPU温度',unit:'°C',color:'#ff6572'}};
function drawChart(samples){
  const canvas=$('chart'),ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
  renderEvaluationSummary(currentSession);
  const left=66,right=18,top=24,bottom=42,innerW=w-left-right,innerH=h-top-bottom;
  ctx.clearRect(0,0,w,h);ctx.fillStyle='#091725';ctx.fillRect(0,0,w,h);ctx.font='12px "Segoe UI","Microsoft YaHei"';
  const config=chartSeries[activeChartMetric];
  const points=samples.map((sample,index)=>({sample,time:Number(sample.elapsed_seconds??index),value:sample[activeChartMetric]==null?null:Number(sample[activeChartMetric])})).filter(point=>point.value!=null&&Number.isFinite(point.value));
  if(!points.length){ctx.fillStyle='#7890a7';ctx.fillText(`等待${config.label}数据…`,24,32);chartGeometry=null;return}
  let low=Math.min(...points.map(point=>point.value)),high=Math.max(...points.map(point=>point.value));
  if(Math.abs(high-low)<0.001){low-=1;high+=1}
  const range=high-low,maxTime=Math.max(1,...points.map(point=>point.time));
  points.forEach(point=>{point.x=left+innerW*point.time/maxTime;point.y=top+innerH*(high-point.value)/range});
  ctx.lineWidth=1;ctx.textBaseline='middle';ctx.textAlign='right';
  for(let i=0;i<5;i++){const y=top+innerH*i/4,value=high-range*i/4;ctx.strokeStyle='#203a52';ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke();ctx.fillStyle='#8ca3bb';ctx.fillText(value.toFixed(2),left-9,y)}
  ctx.textBaseline='top';ctx.textAlign='center';
  for(let i=0;i<6;i++){const x=left+innerW*i/5,time=maxTime*i/5;ctx.strokeStyle='#182f45';ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,h-bottom);ctx.stroke();ctx.fillStyle='#8ca3bb';ctx.fillText(`${time.toFixed(time<10&&time%1?1:0)}s`,x,h-bottom+10)}
  ctx.fillStyle='#9bb0c4';ctx.textAlign='left';ctx.fillText(config.unit,left,5);ctx.textAlign='right';ctx.fillText('时间',w-right,h-17);
  ctx.strokeStyle='#48627b';ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,h-bottom);ctx.lineTo(w-right,h-bottom);ctx.stroke();
  ctx.strokeStyle=config.color;ctx.lineWidth=2.5;ctx.beginPath();points.forEach((point,index)=>index?ctx.lineTo(point.x,point.y):ctx.moveTo(point.x,point.y));ctx.stroke();
  if(chartHoverPoint){const nearest=points.reduce((best,point)=>Math.abs(point.time-chartHoverPoint.time)<Math.abs(best.time-chartHoverPoint.time)?point:best);chartHoverPoint=nearest;ctx.save();ctx.setLineDash([4,4]);ctx.strokeStyle='#a9c4dc';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(nearest.x,top);ctx.lineTo(nearest.x,h-bottom);ctx.moveTo(left,nearest.y);ctx.lineTo(w-right,nearest.y);ctx.stroke();ctx.restore();ctx.beginPath();ctx.arc(nearest.x,nearest.y,5,0,Math.PI*2);ctx.fillStyle=config.color;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke()}
  chartGeometry={points,left,right,top,bottom,w,h,config};
}
async function refreshCurrent(){if(!currentId)return;const session=await api(`/api/sessions/${currentId}`);currentSession=session;const status=session.status;$('sessionStatus').textContent=statusNames[status]||status;$('sessionStatus').className=`status ${status==='failed'?'failed':status==='completed'?'completed':'running'}`;$('sessionMeta').textContent=`${session.package_name} · ${session.serial} · ${session.requested_duration}s · ${session.id}`;const samples=session.samples||[],last=samples.at(-1)||{};const elapsed=last.elapsed_seconds||0;$('progressBar').style.width=`${Math.min(100,elapsed/session.requested_duration*100)}%`;const liveFps=session.live?.realtime_fps??last.realtime_fps;$('realtimeFps').textContent=number(liveFps);const frame=session.result?.frame;$('fps').textContent=number(frame?.average_fps);$('appCpu').textContent=last.app_cpu_normalized_percent==null?'--':`${number(last.app_cpu_normalized_percent)}%`;$('totalCpu').textContent=last.system_cpu_percent==null?'--':`${number(last.system_cpu_percent)}%`;$('gpuUsage').textContent=last.gpu_usage_percent==null?'N/A':`${number(last.gpu_usage_percent)}%`;$('memory').textContent=last.memory_mb==null?'--':`${number(last.memory_mb)} MB${last.memory_usage_percent==null?'':` / ${number(last.memory_usage_percent)}%`}`;$('temperature').textContent=last.cpu_temperature_c==null?'--':`${number(last.cpu_temperature_c)}°C`;drawChart(samples);if(session.error)showError(session.error);if(session.report_url)$('reportAction').innerHTML=`<a href="${session.report_url}" target="_blank">打开中文HTML报告 →</a>`;$('perfdogMetrics').textContent=frame?`PerfDog公开口径 · Var(FPS) ${number(frame.fps_variance)} · Std(FPS) ${number(frame.fps_standard_deviation)} · Jank ${frame.janky_frames??0} · BigJank ${frame.big_jank_frames??0} · Avg(FTime) ${number(frame.frame_time_ms?.average)}ms`:'';if(['completed','failed'].includes(status)){$('start').disabled=false;$('stop').disabled=true;clearInterval(pollTimer);pollTimer=null;await loadHistory()}}
function startPolling(){if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(()=>refreshCurrent().catch(e=>showError(e.message)),500)}
async function loadHistory(){const data=await api('/api/sessions');const rows=data.sessions;$('historyBody').innerHTML=rows.length?rows.map(s=>{const cpu=s.result?.sample_summary?.app_cpu_normalized?.average,mem=s.result?.sample_summary?.memory_mb?.maximum,fps=s.result?.frame?.average_fps;return `<tr data-id="${s.id}"><td>${new Date(s.started_at).toLocaleString()}</td><td>${s.package_name}</td><td>${s.requested_duration}s</td><td>${number(fps)}</td><td>${cpu==null?'--':number(cpu)+'%'}</td><td>${mem==null?'--':number(mem)+' MB'}</td><td><span class="tag">${statusNames[s.status]||s.status}</span></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">暂无任务</td></tr>';$('historyBody').querySelectorAll('tr[data-id]').forEach(row=>row.onclick=async()=>{currentId=row.dataset.id;await refreshCurrent()})}
document.querySelectorAll('.legend span[data-key]').forEach(item=>item.addEventListener('click',()=>{activeChartMetric=item.dataset.key;chartHoverPoint=null;$('chartTooltip').classList.remove('visible');document.querySelectorAll('.legend span[data-key]').forEach(node=>node.classList.toggle('active',node===item));drawChart(currentSession?.samples||[])}));
$('chart').addEventListener('mousemove',event=>{if(!chartGeometry)return;const canvas=$('chart'),rect=canvas.getBoundingClientRect(),mouseX=(event.clientX-rect.left)*canvas.width/rect.width;const nearest=chartGeometry.points.reduce((best,point)=>Math.abs(point.x-mouseX)<Math.abs(best.x-mouseX)?point:best);chartHoverPoint=nearest;drawChart(currentSession?.samples||[]);const tooltip=$('chartTooltip'),config=chartGeometry.config;tooltip.innerHTML=`<strong>${config.label}</strong>时间：${nearest.time.toFixed(3)} s<br>数值：${nearest.value.toFixed(2)} ${config.unit}`;tooltip.classList.add('visible');const wrap=canvas.parentElement,wrapRect=wrap.getBoundingClientRect(),screenX=rect.left+nearest.x*rect.width/canvas.width-wrapRect.left,screenY=rect.top+nearest.y*rect.height/canvas.height-wrapRect.top;tooltip.style.left=`${Math.max(4,Math.min(wrapRect.width-tooltip.offsetWidth-14,screenX))}px`;tooltip.style.top=`${screenY}px`});
$('chart').addEventListener('mouseleave',()=>{chartHoverPoint=null;$('chartTooltip').classList.remove('visible');drawChart(currentSession?.samples||[])});
$('refreshDevice').onclick=()=>loadDevices().catch(e=>showError(e.message));$('device').onchange=()=>loadPackages().catch(e=>showError(e.message));$('package').onchange=()=>{$('packageManual').value=$('package').value};$('start').onclick=()=>startSession().catch(e=>{showError(e.message);$('start').disabled=false});$('stop').onclick=()=>stopSession().catch(e=>showError(e.message));$('refreshHistory').onclick=()=>loadHistory().catch(e=>showError(e.message));
window.addEventListener('pywebviewready',async()=>{try{const info=await window.pywebview.api.client_info();$('clientActions').style.display='flex';$('health').textContent=`客户端模式 · v${info.version}`;$('installOverlay').onclick=async()=>{const result=await window.pywebview.api.install_overlay($('device').value);result.ok?alert(result.message):showError(result.message)};$('openReports').onclick=()=>window.pywebview.api.open_reports_folder();$('openData').onclick=()=>window.pywebview.api.open_data_folder()}catch(e){showError(`客户端接口异常：${e.message||e}`)}});
(async()=>{try{const health=await api('/api/health');$('health').textContent=`服务正常 · v${health.version}`;await loadDevices();await loadHistory();drawChart([])}catch(e){$('health').textContent='服务异常';showError(e.message)}})();
</script></body></html>
